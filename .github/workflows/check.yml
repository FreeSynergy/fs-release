# Reusable check gate for every FreeSynergy Rust repo, meant to run on every push. No secrets. Usage: docs/usage.md
# Stricter than ci.yml (workspace-wide, clippy::pedantic); ci.yml additionally offers MSRV and cargo-deny.
# The checks and their flags live ONLY in scripts/gates.sh (actions/gates runs it); the toolchain version ONLY in RUST_VERSION.
name: check
on:
  workflow_call:
    inputs:
      working-directory: { type: string, default: ".", description: "Directory of the Cargo workspace (and root for the rules checker)" }
      apt-packages: { type: string, default: "", description: "System packages needed to build/test" }
      runs-on: { type: string, default: ubuntu-24.04, description: "Runner label" }
      software-gpu: { type: boolean, default: false, description: "Repos with window tests: installs lavapipe (software Vulkan adapter) and the fonts the tests need; merged with apt-packages" }
      test-env: { type: string, default: "", description: "Environment for the test step, one KEY=VALUE per line (for tests that need a tool the runner lacks and say so)" }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        if: inputs.apt-packages != '' || inputs.software-gpu
        env:
          PACKAGES: ${{ inputs.apt-packages }}
          SOFTWARE_GPU: ${{ inputs.software-gpu }}
        run: |
          if [ "$SOFTWARE_GPU" = "true" ]; then
            PACKAGES="$PACKAGES mesa-vulkan-drivers libvulkan1 fonts-dejavu-core fonts-noto-core"
          fi
          # one list, every package once (apt-packages and software-gpu may name the same one)
          # shellcheck disable=SC2086
          PACKAGES=$(printf '%s\n' $PACKAGES | awk '!seen[$0]++' | tr '\n' ' ')
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES
      - uses: FreeSynergy/fs-release/actions/setup-rust@main
        with:
          toolchain: pinned
          components: rustfmt,clippy
          working-directory: ${{ inputs.working-directory }}
          cache-key: check
      - name: Test environment
        if: inputs.test-env != ''
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: printf '%s\n' "$TEST_ENV" >> "$GITHUB_ENV"
      - name: Gates (fmt, clippy pedantic, test, FreeSynergy coding rules - ADR 0043)
        uses: FreeSynergy/fs-release/actions/gates@main
        with:
          working-directory: ${{ inputs.working-directory }}
