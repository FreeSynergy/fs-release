# Internal: Linux packages (matrix x86_64 + aarch64) and the Arch package.
name: _release-linux
on:
  workflow_call:
    inputs:
      plan: { type: string, required: true }
      apt-packages: { type: string, default: "" }

permissions:
  contents: read

jobs:
  build:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.plan).linux_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        if: inputs.apt-packages != ''
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES
      - uses: FreeSynergy/fs-release/actions/setup-rust@main
        with:
          targets: ${{ matrix.triple }}
          working-directory: ${{ fromJSON(inputs.plan).workdir }}
          cache-key: release-${{ matrix.arch }}
      - if: contains(fromJSON(inputs.plan).linux_formats, 'deb')
        uses: FreeSynergy/fs-release/actions/install-tools@main
        with:
          tools: cargo-deb
      - if: contains(fromJSON(inputs.plan).linux_formats, 'rpm')
        uses: FreeSynergy/fs-release/actions/install-tools@main
        with:
          tools: cargo-generate-rpm
      - uses: FreeSynergy/fs-release/actions/package-linux@main
        with:
          plan: ${{ inputs.plan }}
          arch: ${{ matrix.arch }}
          triple: ${{ matrix.triple }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  arch:
    name: arch x86_64
    needs: build
    if: fromJSON(inputs.plan).has_arch
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel jq
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-x86_64
          path: dist
      - uses: FreeSynergy/fs-release/actions/package-arch@main
        with:
          plan: ${{ inputs.plan }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
