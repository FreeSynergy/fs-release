# Probe for actions/typing-test: builds the fields example of fs-components (a window with text inputs) and runs
# the typing test on it under a virtual KWin. The app repos call the action the same way with their own binary.
name: typing-test-probe
on:
  workflow_dispatch:
    inputs:
      components-ref: { description: "fs-components ref to build", default: q0-blinc-one-place }
      max-ms: { description: "Limit for the median key-to-picture time in ms", default: "8" }
  push:
    branches: [q1b-typing-test]
    paths: ["actions/typing-test/**", "scripts/typing-test*", "scripts/typing-test/**", ".github/workflows/typing-test-probe.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FreeSynergy/fs-components
          ref: ${{ inputs.components-ref || 'q0-blinc-one-place' }}
          path: components
          persist-credentials: false
      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev libssl-dev
      - uses: ./release/actions/setup-rust
        with:
          working-directory: components
          cache-key: typing-probe
      - name: Build the fields example (release)
        working-directory: components
        run: cargo build --release -p fs-components-fields --example form
      - name: Keep the binary (to try the test in a container)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: form-binary
          path: components/target/release/examples/form
          retention-days: 1
      - uses: ./release/actions/typing-test
        with:
          app-binary: components/target/release/examples/form
          click-in-window: "220,177"
          max-ms: ${{ inputs.max-ms || '8' }}
          name: fields-form
      - name: Isolation of the test from the session
        run: release/tests/typing-test/isolation.sh
      - name: A wrong layout must turn the test red
        id: wrong
        continue-on-error: true
        uses: ./release/actions/typing-test
        with:
          app-binary: components/target/release/examples/form
          click-in-window: "220,177"
          layout: us
          inject-layout: de  # the injector types for de while the keyboard is us: the characters come out wrong
          runs: "1"
          install: "false"
          name: fields-form-us
      - name: The wrong layout was caught (exit 1), not just "the test did not run" (exit 2)
        if: always() && steps.wrong.outcome != 'skipped'
        env:
          CODE: ${{ steps.wrong.outputs.exit-code }}
        run: |
          case "$CODE" in
            1) echo "layout us with the keys of de turned the test red (exit 1), as wanted" ;;
            0) echo "the typing test passed with layout us: it does not check the characters" >&2; exit 1 ;;
            *) echo "the typing test did not run with layout us (exit '$CODE'): nothing was checked" >&2; exit 1 ;;
          esac
