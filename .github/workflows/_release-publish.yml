# Internal: after a successful finalize - publish the draft as Pre-release (own GITHUB_TOKEN, no secret).
# The catalog is NOT touched from here: fs-catalog pulls published Pre-releases itself (see DESIGN.md "Release to catalog").
name: _release-publish
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      dry-run: { type: boolean, default: false }

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: FreeSynergy/fs-release/actions/publish-release@main
        with:
          tag: ${{ inputs.tag }}
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          dry-run: ${{ inputs.dry-run }}
