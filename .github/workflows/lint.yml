# Lints fs-release itself: workflow syntax (actionlint, MIT) and shell scripts (shellcheck, GPL-3.0 - used as a CI tool only, never shipped).
name: lint
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck -x -S warning scripts/*.sh scripts/typing-test/*.sh tests/packaging/*.sh tests/typing-test/*.sh actions/*/*.sh
      - name: python
        run: python3 -I -m py_compile actions/plan/plan.py actions/package-linux/placeholder_icon.py scripts/check_rust_rules.py scripts/typing-test/analyze.py scripts/typing-test/fieldcheck.py scripts/typing-test/stau.py scripts/typing-test/summary.py tests/typing-test/caret.py tests/typing-test/glyphs.py
  packaging-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: no composite action calls another fs-release action by a moving ref
        run: |
          # actions/ must not say `uses: FreeSynergy/fs-release/...@ref` (a pinned action would pull later main states of the
          # other one): call the shared script by path from $GITHUB_ACTION_PATH instead. Reusable workflows cannot use `./`
          # (it means the caller's repo) and are pinned by scripts/pin-refs.sh at release time.
          if grep -rnE 'uses:[[:space:]]*FreeSynergy/fs-release/' actions; then echo "::error::composite action refers to fs-release by @ref"; exit 1; fi
      - name: packaging tests (plan, package groups, fs-capnpc compatibility)
        run: scripts/test-packaging.sh
      - name: typing test, caret and field detection on synthetic pictures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil
          tests/typing-test/caret.sh
          tests/typing-test/glyphs.sh
          tests/typing-test/runs.sh
          tests/typing-test/vsession.sh
