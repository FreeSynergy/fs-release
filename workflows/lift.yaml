# The lift (`fs-release lift`, crates/fs-release/src/lift): one deterministic command, no LLM. Step names are the names of the
# Task impls in the code; a test keeps both in step. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: lift
  version: 0.0.4
  title: Lift a program onto new fs-components / fs-interfaces tags
do:
  - deps:
      call: deps:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Set the git tag of every fs-components / fs-interfaces dependency in the workspace.
  - lock:
      call: lock:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: cargo update --workspace, then prove Cargo.lock holds the asked tags.
  - lock-gate:
      call: lock-gate:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: blinc-approved-list
        freesynergy.net:kind: objective
        freesynergy.net:summary: Exactly one Blinc source in Cargo.lock, and it is on the approved list.
  - fmt:
      call: fmt:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:may-fail: red is recorded, the next checks still run
  - clippy:
      call: clippy:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:may-fail: red is recorded, the next checks still run
  - clippy-stable:
      call: clippy-stable:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The CI-strict run, stable toolchain, --locked, pedantic.
        freesynergy.net:may-fail: red is recorded, the next checks still run
  - rules:
      call: rules:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:may-fail: red is recorded, the next checks still run
  - tests:
      call: tests:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:may-fail: red is recorded, the next checks still run
  - yaml-check:
      call: yaml-check:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Every .github/workflows/*.yml parses as YAML (and passes actionlint when installed); skipped, never green, without PyYAML.
        freesynergy.net:may-fail: red is recorded, the commit is blocked
  - commit:
      call: commit:0.0.4@fs
      if: ${ .input.commit }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Only after every check was green; commits the changed Cargo.toml files (and Cargo.lock when online).
