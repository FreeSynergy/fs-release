# Convert existing building blocks and Frontends to the layers of ADR 0074: theme contract with fixed block names, DTCG tokens, no fixed colors or spacings in blocks or Frontends, arrangement separate. Goal: new Frontends are built quickly from blocks.
# One run per block group (input.group). Agents never push, tag or merge. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: frontend-umbau
  version: 0.0.4
  title: Convert one group of building blocks to the layers of ADR 0074
do:
  - count:
      call: count-fixed-values:0.0.4@fs
      with:
        group: ${ .input.group }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Script - counts in the group the fixed colors, fixed spacings and block names that are not in the contract; whatever the numbers are, they are written down as the starting state.
  - assign:
      call: assign-tokens:0.0.4@fs
      with:
        group: ${ .input.group }
        counted: ${ .count }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent maps every counted value to a DTCG token and every block to its fixed contract name (WAI-ARIA, Open UI); a value without a fitting token is listed, not invented.
  - before:
      call: render-images:0.0.4@fs
      with:
        group: ${ .input.group }
        state: before
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Renders the images of the group before the change (the reference for the pixel comparison).
  - convert:
      call: convert-ai:0.0.4@fs
      with:
        group: ${ .input.group }
        mapping: ${ .assign }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent replaces fixed colors, spacings and names by tokens and contract names and keeps the arrangement in its own layer; repeat until the script counts 0 fixed colors and spacings. Own worktree, local commits, no push, no tag.
  - recount:
      call: count-fixed-values:0.0.4@fs
      with:
        group: ${ .input.group }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - the same count as at the start; anything but 0 fixed colors and spacings goes back to convert.
  - gates:
      call: gates:0.0.4@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/gates.sh, the one definition of the checks; red goes back to convert.
  - same-pictures:
      call: pixel-compare:0.0.4@fs
      with:
        group: ${ .input.group }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - renders the images after the change and compares them pixel by pixel with the before images; the conversion must not change the look (default theme), a difference goes back to convert.
  - review:
      run:
        workflow:
          namespace: freesynergy.net
          name: review
          version: 0.0.4
        input:
          head: ${ .input.head }
          scope: ${ .input.group }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The one Opus review of this head (review.yaml); NEIN goes back to convert with the findings as the order.
  - release:
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.4
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: release-flow.yaml takes the reviewed head through CI to the release; the person merges and releases, agents never do. No second review here.
