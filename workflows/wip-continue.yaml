# A run that hit the timeout (exit code 124) does not start again from zero. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: wip-continue
  version: 0.0.3
  title: After a timeout save the work as WIP and continue with a follow-up prompt
do:
  - detect:
      call: exit-code:0.0.3@fs
      with:
        expect: 124
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The run ended with rc=124 (timeout); any other code is not this flow.
  - commit-wip:
      call: commit-wip:0.0.3@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Commits the state in the run's own worktree as WIP; no push, no reset.
  - prompt:
      call: write-continue-prompt:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Writes the follow-up prompt - what is done, what is open, where the WIP commit is; the new run starts from it.
