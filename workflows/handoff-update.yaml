# The handoff file of the strategy session and the memory kept in step. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: handoff-update
  version: 0.0.3
  title: Bring todo/handoff-strategy.md and the memory up to date
do:
  - collect:
      call: collect-state:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Collects the open runs, decisions, open questions and what is not proven since the last update.
  - handoff-file:
      call: write-handoff:0.0.3@fs
      with:
        file: todo/handoff-strategy.md
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Updates todo/handoff-strategy.md; no secrets in it.
  - memory:
      call: write-memory:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Brings the memory files and the index in line with the handoff file; a wrong entry is deleted, not left.
  - check-docs:
      call: check-docs:0.0.3@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: check-docs on the handoff file; red goes back to handoff-file.
