# A bug report from the user to a release: reproduce red, fix, green, release (the one Opus review sits in release-flow). Agents never push, tag or
# merge. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: bugfix
  version: 0.0.3
  title: From a user finding to a fixed and released bug
do:
  - finding:
      set:
        finding: ${ .input.finding }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The user's finding (what was done, what was expected, what happened) is taken as it is.
  - reproduce:
      call: build-ai:0.0.3@fs
      with:
        task: write a test that reproduces ${ .input.finding }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent writes a test that fails for exactly this bug (red); repeat until it is red for the right reason.
  - fix:
      call: build-ai:0.0.3@fs
      with:
        task: fix the code, change no test
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent changes the code in its own worktree and commits locally; no push, no tag.
  - green:
      call: gates:0.0.3@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/gates.sh; the new test and all others are green, red goes back to fix (a LLM only on red).
  - release:
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.3
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: release-flow.yaml holds the one Opus review of this head (opus-ja), then CI, then the human or the coordinator merges and releases; there is no second review here, agents never merge.
