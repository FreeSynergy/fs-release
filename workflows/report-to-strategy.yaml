# The report of the coordinator to the strategy session. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: report-to-strategy
  version: 0.0.3
  title: Report a result or a blocker to the strategy
do:
  - gather:
      call: gather-report:0.0.3@fs
      with:
        workflow: ${ .input.workflow }
        run: ${ .input.run }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Collects only the workflow, the run id, the result or blocker, the images and the costs; nothing else goes in.
  - questions:
      call: list-questions:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Open questions come last, one per line, so that the strategy can answer them one by one.
  - send:
      call: send-report:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Hands the report over; the state changes to sent, whatever the answer is.
