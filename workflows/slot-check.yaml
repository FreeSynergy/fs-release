# Build slots, orphans and memory. The slots belong to the build script of the machine. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: slot-check
  version: 0.0.5
  title: Check the build slots for orphans and memory
do:
  - holders:
      call: fuser-lock:0.0.5@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: fuser on every build.lock shows who holds a slot.
  - processes:
      call: pgrep-builds:0.0.5@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: pgrep lists cargo, rustc and test processes; a process without a running run is an orphan.
  - log:
      call: read-slots-log:0.0.5@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Reads slots-watch.log for memory and slot history; memory figures come from the log, not from a guess.
  - end-orphans:
      call: end-orphans:0.0.5@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: Ends orphans only when their working directory is a test folder; anything else is reported and left alone.
