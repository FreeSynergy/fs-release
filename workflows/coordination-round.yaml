# One round of the coordinator over the running agent runs. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: coordination-round
  version: 0.0.3
  title: The coordinator checks the runs, evaluates finished ones, starts reviews
do:
  - cost-log:
      call: read-cost-log:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Reads the cost log; the state changes to read, whatever it says.
  - evaluate:
      call: read-run-result:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Evaluates every finished run - its report, its commits, what is proven and what is not.
  - fmt-rules-commit:
      call: fmt-rules-commit:0.0.3@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: cargo fmt (the coordinator's, not the agent's), the rule check, then the commit in the run's worktree.
  - review:
      run:
        workflow:
          namespace: freesynergy.net
          name: review
          version: 0.0.3
        input:
          head: ${ .input.branch }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Starts the Opus review of the finished head (review.yaml).
  - slots:
      run:
        workflow:
          namespace: freesynergy.net
          name: slot-check
          version: 0.0.3
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Looks for orphaned build slots (fuser on build.lock), slot-check.yaml.
  - report-need:
      call: report-need:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Decides whether the strategy needs a report; if so report-to-strategy.yaml runs.
