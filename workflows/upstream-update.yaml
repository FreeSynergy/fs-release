# An upstream program has a new release: check it (severity, tag to commit, signature state), pin it in the mirror, check capabilities against the new book,
# review, build in CI, release as Pre-release, raise in the catalog. Security fixes (high, critical) go first. Agents never push, tag or merge.
# Order: `Workflow upstream-update, step check-upstream, parameters upstream, repo, from, book`. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: upstream-update
  version: 0.0.6
  title: Take over a new upstream release into the mirror and the catalog, security fixes first
do:
  - check-upstream:
      call: check-upstream:0.0.6@fs
      with:
        upstream: ${ .input.upstream }
        repo: ${ .input.repo }
      export:
        as: '${ $context + { upstream: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Is there a new upstream tag? Read the release text and the security advisories (gh api, read only), rate the severity (critical, high, medium, low, none), resolve tag to commit (gh api, the commit the tag points to, not the tag object), look at the signature state of tag and commit (unsigned stays unsigned, a change is reported). Output - tag, commit, date, severity, advisory ids, signature state.
  - pin:
      call: pin-mirror:0.0.6@fs
      with:
        tag: ${ $context.upstream.tag }
        commit: ${ $context.upstream.commit }
        released: ${ $context.upstream.released }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Sets mirror.toml (version, released, tag, commit, artefact names, container note), the capabilities.toml sources and version, scripts and tests that carry the old version, and the README; adds the security note (severity, advisory, fixed in) to the docs. Only the pinned commit counts; never an unresolved tag.
  - docs:
      call: docs-sync:0.0.6@fs
      with:
        languages: [de, en]
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: docs/de and docs/en are adapted together (mirror.md, capabilities.md, date of the check); both languages say the same, no word of one side missing in the other.
  - capabilities-check:
      call: capabilities-check:0.0.6@fs
      with:
        book: ${ .input.book }
        tag: ${ $context.upstream.tag }
      export:
        as: '${ $context + { capabilities: . } }'
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Every capability line is checked against the book of the NEW version (page and sentence quoted in the report); a line the book does not show is marked 'not proven', never guessed; a changed support value (yes, no, unstable) is reported and decided in the review.
  - compare:
      call: compare-versions:0.0.6@fs
      with:
        from: ${ .input.from }
        to: ${ $context.upstream.tag }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: gh api compare from...to (read only) - do the build toolchain (rust-toolchain, MSRV), the dependencies (Cargo.lock) or the build profile change? The answer goes into the report and decides whether mirror.yml needs a change.
  - local-gates:
      call: repo-gates:0.0.6@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The local gates of the repo (verify-mirror selftest, repo_tool.py checks, rust rules where they apply); red goes back to pin. Gates once per head.
  - review:
      call: review-ai:0.0.6@fs
      with:
        head: ${ .input.branch }
        scope: delta
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Strategy (Opus) reviews the delta and answers YES or NO bound to exactly this head; a security fix with severity high or critical is reviewed the same day. Without the YES nothing is pushed or published.
  - push-branch:
      call: push:0.0.6@fs
      with:
        branch: release-${ $context.upstream.version }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:summary: The coordinator pushes the branch release-<version> after the YES, never forced; the agent never pushes.
  - mirror-ci:
      listen:
        to:
          one:
            with:
              type: net.freesynergy.ci.green
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: mirror.yml builds from source at the pinned commit (refuses if the tag no longer resolves to it), adds source tarball and SBOM, signs; red stops the flow.
  - release:
      listen:
        to:
          one:
            with:
              type: net.freesynergy.release.published
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:summary: The Pre-release is published by the pipeline (tag v<version> of the mirror) only behind the YES of exactly this head.
  - catalog-bump:
      run:
        workflow:
          namespace: freesynergy.net
          name: catalog-bump
          version: 0.0.6
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Sub-workflow catalog-bump - the new Pre-release is raised in packages.toml and the catalog is signed.
  - catalog-check:
      call: check:0.0.6@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Looks at the catalog like a user - fresh clone, signature, the new version is in it and the old one is no longer offered as current.
