# A question to the user and what follows from the answer. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: user-decision
  version: 0.0.4
  title: Ask the user, record the answer, turn it into an order
do:
  - question:
      call: write-question:0.0.4@fs
      with:
        topic: ${ .input.topic }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Formulates one clear question with the options and a recommendation; repeat until it is clear.
  - answer:
      call: ask:0.0.4@fs
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The user answers; the answer is taken as it is.
  - record:
      call: write-memory:0.0.4@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The answer goes into memory and the handoff file (handoff-update.yaml) so that it survives a session change.
  - order:
      call: write-order:0.0.4@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Turns the answer into an order that names a workflow, a step and parameters.
