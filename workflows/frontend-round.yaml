# One round on a Frontend: dossier, gap list, images, the user's verdict, build, acceptance by clicking through the working flows, release.
# Agents never push, tag or merge. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: frontend-round
  version: 0.0.3
  title: A Frontend round from the research dossier to the release
do:
  - dossier:
      run:
        workflow:
          namespace: freesynergy.net
          name: dossier
          version: 0.0.3
        input:
          frontend: ${ .input.frontend }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The research dossier of the Frontend exists and passes check-docs (sub-workflow dossier.yaml, research by the agent, check-docs by the machine); repeat until it does. The sub-workflow ends with the human publish into the docs main branch, so the step carries that gate.
  - gap-list:
      call: gap-list:0.0.3@fs
      with:
        frontend: ${ .input.frontend }
        dossier: ${ .input.dossier }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Compares dossier (states, dialogs, menus, shortcuts, workflows, gaps) with our Frontend and writes the list of what is missing.
  - images:
      call: render-images:0.0.3@fs
      with:
        frontend: ${ .input.frontend }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Renders the images of the gap list (old and new state) and shows them; whatever they look like, the state changes to shown.
  - picture-verdict:
      run:
        workflow:
          namespace: freesynergy.net
          name: picture-acceptance
          version: 0.0.3
        input:
          model: ${ .input.model }
          ours: ${ .images }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The user's verdict on the images (picture-acceptance.yaml) is taken as it is; not accepted goes back to build with the user's words as the order.
  - build:
      call: build-ai:0.0.3@fs
      with:
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent builds the gaps in its own worktree and commits locally; repeat until the gates are green, no push, no tag.
  - gates:
      call: gates:0.0.3@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: scripts/gates.sh, the one definition of the checks; red goes back to build.
  - acceptance:
      call: click-through:0.0.3@fs
      with:
        file: ${ .input.dossier }/acceptance.md
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Script - reads acceptance.md of the dossier and clicks through every working flow listed there in the running Frontend (virtual session); a flow that fails goes back to build.
  - acceptance-red:
      call: explain-red:0.0.3@fs
      if: ${ .acceptance.red }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Only when a flow failed - the agent finds the cause and writes the order for build; the script decides green or red, not the agent.
  - release:
      run:
        workflow:
          namespace: freesynergy.net
          name: release-flow
          version: 0.0.3
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: release-flow.yaml holds the one Opus review of this head (opus-ja), then CI, then the human or the coordinator merges and releases; there is no second review here, agents never merge.
