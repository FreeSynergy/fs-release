# One run of a program agent: from the order to the merge. Machine, AI and human steps in one list; the human step is the
# only one that pushes, tags or merges. The order to the agent is compact: `Workflow agent-run, step <id>, parameters repo,
# branch, head, delta, task`; the agent reads this file and rules.md itself (docs/prompt-template.md). FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: agent-run
  version: 0.0.5
  title: An agent builds a change in its own worktree, Opus reviews it, a human publishes it
do:
  - order:
      set:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
        task: ${ .input.task }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The order comes from the coordinator or the user and holds only the parameters repo, branch (unreviewed/<task>), head, delta and the task text; everything recurring is in this file and in rules.md.
  - worktree:
      call: worktree:0.0.5@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Creates the agent's own git worktree on the branch; the agent works only there.
  - build:
      call: build-ai:0.0.5@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
        task: ${ .input.task }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent changes code and tests and commits locally ([COMMIT]), runs the checks one at a time ([GATES], commands one at a time per [BASH]), keeps no helper files and no orphan processes ([TESTS], [WORTWAHL]) and writes BERICHT.md in the form of [BERICHT]. No push, no tag, no release.
  - fmt:
      call: fmt:0.0.5@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: cargo fmt by the coordinator's machine step, not by the agent.
  - review:
      call: review-ai:0.0.5@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Opus reads the diff (review.yaml, [REVIEW]); a JA is bound to exactly this head, NEIN comes with findings.
  - cleanup:
      call: remove-build-dir:0.0.5@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The run removes its own throw-away build folder (target/) at the end, success or not.
        freesynergy.net:may-fail: a folder that is already gone is fine
  - publish:
      call: publish:0.0.5@fs
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The human or the coordinator pushes, tags and merges (release-flow.yaml); the agent never does.
