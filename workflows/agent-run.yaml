# One run of a program agent: from the order to the merge. Machine, AI and human steps in one list; the human step is the
# only one that pushes, tags or merges. The order to the agent is compact: `Workflow agent-run, step <id>, parameters repo,
# branch, head, delta, task`; the agent reads this file and rules.md itself (docs/prompt-template.md). rules.md is the file
# /srv/FreeSynergy/.scratch/api-runner/rules.md (the one that applies; there is no copy in the repo). FS profile: see README.md.
# [EFFIZIENZ] (strategy c5) as step rules: one run = one gate cycle (build, gates once, commit; the rest is a follow-up order);
# gates once per head (a green result for exactly this head is reused, the head hash is in the report); the order names the
# files to read; mechanics (fmt, rule check, push, tag, release, clean-up) is a script of the coordinator, not an agent; after
# a timeout (rc=124) find the cause first, then restart with a continuation prompt (WIP commit), never repeat blindly.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: agent-run
  version: 0.0.6
  title: An agent builds a change in its own worktree, Opus reviews it, a human publishes it
do:
  - order:
      set:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
        task: ${ .input.task }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: none
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The order comes from the coordinator or the user and holds only the parameters repo, branch (unreviewed/<task>), head, delta and the task text; everything recurring is in this file and in rules.md.
  - worktree:
      call: worktree:0.0.6@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Creates the agent's own git worktree on the branch; the agent works only there.
  - build:
      call: build-ai:0.0.6@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
        task: ${ .input.task }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The agent changes code and tests and commits locally ([COMMIT]), runs the checks one at a time ([GATES], commands one at a time per [BASH]), keeps no helper files and no orphan processes ([TESTS], [WORTWAHL]) and writes BERICHT.md in the form of [BERICHT]. No push, no tag, no release. [EFFIZIENZ] - one run is one gate cycle (build, gates once, commit; no second cycle, the rest is a follow-up order); the gates run once per head and the report names the head hash they ran for; the agent reads only the files the order names and what they directly need; mechanics (fmt, rule check, push, tag, clean-up) is the coordinator's script, not the agent's; after a timeout or rc=124 the cause is checked first (lock holders, orphans, slot queue) and the run restarts from the WIP commit, never blindly.
  - fmt:
      call: fmt:0.0.6@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: cargo fmt by the coordinator's machine step, not by the agent ([EFFIZIENZ] - mechanics is a script, not an agent).
  - review:
      call: review-ai:0.0.6@fs
      with:
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: subjective
        freesynergy.net:summary: Opus reads the diff (review.yaml, [REVIEW]); a JA is bound to exactly this head, NEIN comes with findings.
  - cleanup:
      call: remove-build-dir:0.0.6@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: The run removes its own throw-away build folder (target/) at the end, success or not.
        freesynergy.net:may-fail: a folder that is already gone is fine
  - publish:
      call: publish:0.0.6@fs
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The human or the coordinator pushes, tags and merges (release-flow.yaml); the agent never does.
