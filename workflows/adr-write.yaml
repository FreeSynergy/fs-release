# An ADR of the strategy session: draft, the user decides, work it in, check, push. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: adr-write
  version: 0.0.3
  title: From an ADR draft through the user's decision into the docs
do:
  - draft:
      call: adr-draft:0.0.3@fs
      with:
        topic: ${ .input.topic }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Writes the draft (context, options, recommendation); what is not proven is marked [nicht belegt].
  - decision:
      run:
        workflow:
          namespace: freesynergy.net
          name: user-decision
          version: 0.0.3
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: subjective
        freesynergy.net:summary: The user decides on the draft (user-decision.yaml); the decision is taken as it is.
  - work-in:
      call: adr-update:0.0.3@fs
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Works the decision into the ADR; the status follows the decision, nothing is added on the side.
  - check-docs:
      call: check-docs:0.0.3@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: check-docs on the ADR; red goes back to work-in.
  - push:
      run:
        workflow:
          namespace: freesynergy.net
          name: publish-doc
          version: 0.0.3
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The coordinator pushes - rebase, generator and fast-forward push (publish-doc.yaml); the agent never does.
