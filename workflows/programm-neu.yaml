# New program: from the test question 'whose data?' to acceptance by the user, 17 steps (plus 9a) in the phases P0 to P6.
# Every agent step (objective) is followed by an objective script check; red goes back (switch with then); every step names its ADRs
# (freesynergy.net:adr). Outcomes Facette, Modul and Suite leave the flow at a stub (facette-abzweig, modul-abzweig, suite-abzweig, at the
# end of the file); `facette-anlegen` does not exist yet (TODO, not invented). Agents never push, tag or merge, never touch a real server,
# never handle secrets. Order: `Workflow programm-neu, step <id>, parameters repo, branch, head, delta, programm, vorbild, bestand`
# (docs/prompt-template.md). FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: programm-neu
  version: 0.0.6
  title: Build a new program from the test question to the user acceptance
do:
  - wessen-daten:
      call: classify-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:phase: P0
        freesynergy.net:adr: '0076, 0061'
        freesynergy.net:summary: "Step 1 - the test question 'whose data?' (ADR 0076): the agent writes einordnung.md with exactly one outcome Programm, Facette, Modul or Suite and the reason (own data and own rules = Programm; a fixed filter on another program's data = Facette, ADR 0061; a part inside a program = Modul; several programs = Suite). The outcome is a decision, so the gate is opus-ja. Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step wessen-daten, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - ausgang-check:
      call: einordnung-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { einordnung: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P0
        freesynergy.net:adr: '0076'
        freesynergy.net:summary: "Script (no network, no AI) - einordnung.md has exactly one outcome of Programm, Facette, Modul, Suite and a non-empty reason; the result carries the flags `facette`, `modul`, `suite` (at most one true). The result carries `red` (true = back)."
  - einordnung-again:
      switch:
        - red:
            when: '${ $context.einordnung.red }'
            then: wessen-daten
        - facette:
            when: '${ $context.einordnung.facette }'
            then: facette-abzweig
        - modul:
            when: '${ $context.einordnung.modul }'
            then: modul-abzweig
        - suite:
            when: '${ $context.einordnung.suite }'
            then: suite-abzweig
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P0
        freesynergy.net:adr: '0076'
        freesynergy.net:summary: "Control flow - red goes back to wessen-daten; then `ausgang` branches (below): Facette, Modul and Suite leave this flow at their stub, only Programm continues."
  - katalog-suche:
      call: catalog-lookup:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { katalog: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P0
        freesynergy.net:adr: '0068, 0077'
        freesynergy.net:summary: "Step 2 - hub and catalog: the script looks in fs-catalog (and the hub) for a package that already provides the capability (AppStream provides, ADR 0068; kind per ADR 0077); `vorhanden` true means: use or extend that package, no new program. The result carries `red` (true = back)."
  - katalog-weiter:
      switch:
        - vorhanden:
            when: '${ $context.katalog.vorhanden }'
            then: end
        - neu:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P0
        freesynergy.net:adr: '0068'
        freesynergy.net:summary: "Control flow - the capability exists already: the flow ends (the existing package is used or extended in its own workflow); otherwise it goes on to P1."
  - standards:
      call: standards-research-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0014'
        freesynergy.net:summary: "Step 3 - standards first (ADR 0014): for every data type of the program the agent names the standard (AS2 as the common base, JSContact, JSCalendar ...) with its official test collections (conformance suites); an own format only where no standard exists, with the proof of the search; nothing is copied (ADR 0013). Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step standards, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - standards-check:
      call: standards-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { standards: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0014'
        freesynergy.net:summary: "Script - every data type names a standard or a search proof for 'none', and every named standard names its test collection or `[keine Testsammlung]` with a reason; red when one is missing. The result carries `red` (true = back)."
  - standards-again:
      switch:
        - red:
            when: '${ $context.standards.red }'
            then: standards
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0014'
        freesynergy.net:summary: "Control flow - red goes back to standards."
  - kern-crate:
      call: core-crate-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: opus-ja
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0015, 0014'
        freesynergy.net:summary: "Step 4 - search the core crate: candidates with licence (list of allowed licences), maturity (releases, maintenance, tests) and the way in (wrapper with a Git pin and an adapter, never a fork; flow wrapper-einbindung); no suitable crate means an own core, with the reason. The choice of a dependency is a decision, so the gate is opus-ja. Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step kern-crate, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - kern-check:
      call: license-compare:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { kern: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0015'
        freesynergy.net:summary: "Script - the licences of the chosen crate and its dependencies against the allowed list, a pin exists, the repo is no fork; red on a forbidden licence or a fork. The result carries `red` (true = back)."
  - kern-again:
      switch:
        - red:
            when: '${ $context.kern.red }'
            then: kern-crate
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0015'
        freesynergy.net:summary: "Control flow - red goes back to kern-crate."
  - umzug:
      call: migration-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0014, 0046, 0085'
        freesynergy.net:summary: "Step 5 - fix the formats and the way of moving house: the formats of the widespread programs of this topic (read and write their files) with sample files as fixtures, and for every time and every person field the inner form per ADR 0085 (draft): times in UTC plus IANA zone id where the local meaning counts, all-day dates without time, persons as references to People (frozen extract only for bookings, invoices, contracts); the commands for import and export themselves are built in step 9a; export is its own command, not saving (ADR 0046). Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step umzug, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - umzug-check:
      call: roundtrip-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { umzug: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0046'
        freesynergy.net:summary: "Script - for every named format an import and an export command exist and a round trip over the fixtures keeps the data (or names the loss); red otherwise. The result carries `red` (true = back)."
  - umzug-again:
      switch:
        - red:
            when: '${ $context.umzug.red }'
            then: umzug
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P1
        freesynergy.net:adr: '0046'
        freesynergy.net:summary: "Control flow - red goes back to umzug."
  - datenmodell:
      call: datamodel-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0014, 0046, 0076, 0085'
        freesynergy.net:summary: "Step 6 - the data model on the standards: types and fields map to the standards of step 3 (time and person fields as in step 5, ADR 0085 draft: UTC plus zone id, date only, person reference), storage through fs-store, history as AS2 activities through fs-history, saving is not exporting (ADR 0046: work on the database copy, export is separate). Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step datenmodell, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - modell-check:
      call: model-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { modell: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0046'
        freesynergy.net:summary: "Script - every field maps to a standard field, storage goes through fs-store, changes are AS2 activities in fs-history, no export inside the save path; red otherwise. The result carries `red` (true = back)."
  - modell-again:
      switch:
        - red:
            when: '${ $context.modell.red }'
            then: datenmodell
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0046'
        freesynergy.net:summary: "Control flow - red goes back to datenmodell."
  - schnittstelle:
      call: interface-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0045, 0066'
        freesynergy.net:summary: "Step 7 - the topic interface in fs-interfaces: a capnp schema plus a trait; what a backend cannot do answers Unsupported (ADR 0045, an interface is a target, a change is a jump); every command carries `supported` (ADR 0066) and the type description reports fields, base types and commands. Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step schnittstelle, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - schnittstelle-check:
      call: interface-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { schnittstelle: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0045, 0066'
        freesynergy.net:summary: "Script - the capnp schema compiles, a trait exists, Unsupported is returned for a missing capability, every command has `supported`; the result may carry `modell` (the model is wrong). The result carries `red` (true = back)."
  - schnittstelle-again:
      switch:
        - modell:
            when: '${ $context.schnittstelle.modell }'
            then: datenmodell
        - red:
            when: '${ $context.schnittstelle.red }'
            then: schnittstelle
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0045'
        freesynergy.net:summary: "Control flow - a model fault (flag `modell`) goes back to datenmodell, any other red to schnittstelle."
  - manifest:
      call: manifest-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0068, 0074'
        freesynergy.net:summary: "Step 8 - the manifest: the functions and objects the program publishes for menus (ADR 0074) and what it provides and requires as capabilities (ADR 0068, AppStream provides/requires, no own format). Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step manifest, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - manifest-check:
      call: manifest-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { manifest: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0068, 0074'
        freesynergy.net:summary: "Script - the manifest parses, every function and object has a name and a command of the interface, provides and requires use versions; red otherwise. The result carries `red` (true = back)."
  - manifest-again:
      switch:
        - red:
            when: '${ $context.manifest.red }'
            then: manifest
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P2
        freesynergy.net:adr: '0068'
        freesynergy.net:summary: "Control flow - red goes back to manifest."
  - engine:
      call: engine-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0021, 0045, 0014'
        freesynergy.net:summary: "Step 9 - the engine against the interface: the engine implements the trait; the contract tests (same for every backend) and the standard test collection of step 3 run against it ([GATES]). Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step engine, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - engine-check:
      call: contract-tests:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { engine: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0045, 0014'
        freesynergy.net:summary: "Script - contract tests and the standard test collection are green; the result may carry `schnittstelle` (the contract itself is wrong). The result carries `red` (true = back)."
  - engine-again:
      switch:
        - vertrag:
            when: '${ $context.engine.schnittstelle }'
            then: schnittstelle
        - red:
            when: '${ $context.engine.red }'
            then: engine
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0045'
        freesynergy.net:summary: "Control flow - a contract fault goes back to schnittstelle, any other red to engine."
  - grenz-adapter:
      call: boundary-adapter-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0085, 0014, 0046'
        freesynergy.net:summary: "Step 9a - importers and exporters as border adapters (ADR 0085, draft): every importer reads a foreign format and normalizes it into the inner model (times to UTC plus IANA zone id, all-day dates stay dates, person names become references to People or to the small local store); every exporter converts for the target and is its own command, not saving (ADR 0046); what cannot be mapped is kept as the original and reported. Tests with the sample files of step 5 and a round trip. Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step grenz-adapter, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - grenz-check:
      call: boundary-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { grenz: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0085'
        freesynergy.net:summary: "Script - every import and export command has tests with foreign sample files; no free person name and no local time without zone in the inner model after an import; export of an all-day date stays a date; red otherwise. The result carries `red` (true = back)."
  - grenz-again:
      switch:
        - red:
            when: '${ $context.grenz.red }'
            then: grenz-adapter
        - green:
            then: continue
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0085'
        freesynergy.net:summary: "Control flow - red goes back to grenz-adapter."
  - admin-frontend:
      call: admin-frontend-ai:0.0.6@fs
      with:
        programm: ${ .input.programm }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        head: ${ .input.head }
        delta: ${ .input.delta }
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0061, 0066'
        freesynergy.net:summary: "Step 10 - the admin Frontend generated from the type description (Fiori idea, ADR 0066: all fields, all settings, all commands; mandatory for program and facet, ADR 0061); no data of its own. Own worktree, local commits ([COMMIT]), no push, no tag; gates one at a time ([GATES], [BASH]); no secrets ([BERICHT] names none); report per [BERICHT]. Order - `Workflow programm-neu, step admin-frontend, parameters repo, branch, head, delta, programm` (docs/prompt-template.md)."
  - admin-check:
      call: admin-check:0.0.6@fs
      with:
        programm: ${ .input.programm }
      export:
        as: '${ $context + { admin: . } }'
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:phase: P3
        freesynergy.net:adr: '0061, 0066'
