# The research dossier of a Frontend: files in R2 with sourced facts, check-docs, then the docs main branch.
# Order: `Workflow dossier, step research, parameters frontend, repo, branch` (docs/prompt-template.md); the file list,
# the source rule and the report form are in this file and rules.md [BERICHT], not in the order. FS profile: see README.md.
document:
  dsl: 1.0.3
  namespace: freesynergy.net
  name: dossier
  version: 0.0.6
  title: Research a Frontend into a dossier and publish it to the docs
do:
  - research:
      call: research-ai:0.0.6@fs
      with:
        frontend: ${ .input.frontend }
        repo: ${ .input.repo }
        branch: ${ .input.branch }
        files: [states, dialogs, menus, context-menus, shortcuts, workflows, acceptance, gaps]
      metadata:
        freesynergy.net:actor: ai
        freesynergy.net:actor-type: Application
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: Writes one research file each for states, dialogs, menus and context menus, shortcuts, workflows, acceptance.md and gaps into R2; every fact has a source, what is not proven is marked [nicht belegt]; the menus file carries a `## Menü-Inventar` list (nested bullets with optional shortcut and names, format in docs/menue-vergleich.md) and the dialogs file a table or `## Dialog-Inventar` list, because scripts/menue-vergleich reads them (docs/menue-vergleich.md); ADR 0013 - nothing is copied. Read-only on the Frontend, no network beyond the sources named in the order, commits per [COMMIT], report per [BERICHT].
  - check-docs:
      call: check-docs:0.0.6@fs
      metadata:
        freesynergy.net:actor: machine
        freesynergy.net:actor-type: Service
        freesynergy.net:gate: none
        freesynergy.net:kind: objective
        freesynergy.net:summary: check-docs on the dossier; red goes back to research until it is green.
  - publish:
      call: docs-main:0.0.6@fs
      with:
        frontend: ${ .input.frontend }
      metadata:
        freesynergy.net:actor: human
        freesynergy.net:actor-type: Person
        freesynergy.net:gate: human
        freesynergy.net:kind: objective
        freesynergy.net:summary: The human or the coordinator brings the green dossier into the docs main branch; the agent never does.
