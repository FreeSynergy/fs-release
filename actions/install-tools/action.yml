name: install-tools
description: Install prebuilt cargo tools (cargo-binstall, falling back to a source build).
inputs:
  tools: { description: "Space separated crates, e.g. 'cargo-deb cargo-generate-rpm'", required: true }
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      with:
        tool: cargo-binstall
    - shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        # shellcheck disable=SC2086  # word splitting of the tool list is intended
        cargo binstall --no-confirm --locked $TOOLS
