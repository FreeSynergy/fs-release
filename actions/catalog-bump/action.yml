name: catalog-bump
description: Raise the tag of this program in fs-catalog/packages.toml and push (fs-catalog's sign workflow then regenerates and signs the catalog). Idempotent.
inputs:
  tag: { description: "Release tag", required: true }
  repo: { description: "owner/name of the program repo", default: "${{ github.repository }}" }
  token: { description: "Token with contents write on the catalog repo (secret CATALOG_TOKEN)", default: "" }
  catalog-repo: { description: "owner/name of the catalog repo", default: "FreeSynergy/fs-catalog" }
  dry-run: { description: "true - show the change, push nothing", default: "false" }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG: ${{ inputs.tag }}
        REPO: ${{ inputs.repo }}
        CATALOG_TOKEN: ${{ inputs.token }}
        CATALOG_REPO: ${{ inputs.catalog-repo }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: '"$GITHUB_ACTION_PATH/bump.sh"'
