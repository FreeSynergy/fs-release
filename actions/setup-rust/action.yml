name: setup-rust
description: Newest stable Rust (ADR 0026) plus Swatinem/rust-cache.
inputs:
  toolchain: { description: "Toolchain, e.g. stable or an MSRV like 1.85", default: stable }
  targets: { description: "Comma separated extra targets", default: "" }
  components: { description: "Comma separated components", default: "" }
  working-directory: { description: "Cargo workspace directory", default: "." }
  cache-key: { description: "Extra rust-cache key", default: "" }
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.working-directory }}
        key: ${{ inputs.cache-key }}
