name: typing-test
description: Start a built app under a virtual KWin with a keyboard layout, type @ € { } [ ] \ | ~ ä ö ü ß µ (AltGr and Shift) into a text field, check the text arrives and is visible, and measure key-to-picture time. Same script as scripts/typing-test.sh on a laptop.
inputs:
  app-binary: { description: "Path to the built (release) binary", required: true }
  app-args: { description: "Arguments for the app, one line, split on spaces", default: "" }
  click: { description: "x,y - where to click to focus the text field (1280x800 screen)", default: "" }
  field: { description: "x,y,w,h - the field's rectangle on screen (default: 300x40 around the click point)", default: "" }
  scenario: { description: "App-specific bash fragment defining focus() (uses c '<inject command>' [secs] and shot NAME); replaces click", default: "" }
  layout: { description: "xkb keyboard layout", default: de }
  max-ms: { description: "Limit for the median key-to-picture time in ms", default: "8" }
  name: { description: "Name of the app in the report and the artefact", default: "" }
  install: { description: "Install kwin, spectacle and the other packages with apt (ubuntu runner)", default: "true" }
  working-directory: { description: "Directory to run the app in", default: "." }
  click-in-window: { description: "x,y from the window's top left corner where to click to focus the text field (preferred over click; does not depend on where the compositor places the window)", default: "", required: false }
  text-width: { description: "Width in px of the text part compared with the reference rendering (empty: 110)", default: "", required: false }
  size: { description: "Virtual screen size WxH (empty: 1280x800)", default: "", required: false }
  settle: { description: "Seconds to wait for the app's window (empty: the script's own defaults)", default: "", required: false }
  enforce-ms: { description: "Set to any value to enforce max-ms also without a GPU (software rendering; otherwise the time is only reported there)", default: "", required: false }
  inject: { description: "Path to a prebuilt key injector binary (empty: built with cargo from the repo)", default: "", required: false }
outputs:
  exit-code:
    description: "Exit code of the test: 0 green, 1 test failed (checks red), 2 test did not run (no window, tool missing)"
    value: ${{ steps.test.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Packages for the virtual screen
      if: inputs.install == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends kwin-wayland kwin-wayland-backend-virtual kwin-style-breeze kde-spectacle qtwayland5 \
          dbus python3-pil fontconfig fonts-dejavu-core xkb-data libgl1-mesa-dri libegl1 \
          mesa-vulkan-drivers  # the software Vulkan (lavapipe) that wgpu apps draw with on a runner without GPU
    - name: Typing test
      id: test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APP: ${{ inputs.app-binary }}
        APP_ARGS: ${{ inputs.app-args }}
        TT_CLICK: ${{ inputs.click }}
        TT_CLICK_REL: ${{ inputs.click-in-window }}
        TT_FIELD: ${{ inputs.field }}
        TT_TEXT_WIDTH: ${{ inputs.text-width }}
        TT_SIZE: ${{ inputs.size }}
        TT_SETTLE: ${{ inputs.settle }}
        TT_ENFORCE_MS: ${{ inputs.enforce-ms }}
        TT_INJECT: ${{ inputs.inject }}
        TT_SCENARIO: ${{ inputs.scenario }}
        TT_LAYOUT: ${{ inputs.layout }}
        TT_MAX_MS: ${{ inputs.max-ms }}
        TT_NAME: ${{ inputs.name }}
        TT_OUT: ${{ runner.temp }}/typing-test-out
      run: |
        read -r -a args <<<"$APP_ARGS"
        rc=0
        "$GITHUB_ACTION_PATH/../../scripts/typing-test.sh" "$APP" "${args[@]}" || rc=$?
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        exit "$rc"
    - name: Result (junit.xml, result.json, pictures)
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: typing-test-${{ inputs.name != '' && inputs.name || 'app' }}
        path: |
          ${{ runner.temp }}/typing-test-out/result.json
          ${{ runner.temp }}/typing-test-out/junit.xml
          ${{ runner.temp }}/typing-test-out/shots
          ${{ runner.temp }}/typing-test-out/*.log
          ${{ runner.temp }}/typing-test-out/rect.txt
        if-no-files-found: warn
